services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-reachable URL, not the Docker service name — this is what
        # gets baked into the JS bundle at build time (see frontend/Dockerfile).
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
